<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option 4 — “Arpita's” + swash + tagline</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--pink:#ec4899;--bg:#fff4f9;--ink:#1f2440}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;padding:60px 20px}
  .cap{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#94a3b8;font-weight:600;margin-bottom:-30px}
  .logo{display:flex;flex-direction:column;align-items:center;text-align:center}
  .word{position:relative;display:inline-block;font-weight:700;color:#312e81;line-height:1;letter-spacing:.3px}
  .word .brush{position:absolute;left:-1%;bottom:.02em;width:102%;height:.30em}
  .sub{font-weight:600;color:var(--pink);letter-spacing:5px}
  .white{background:#fff;border:1px solid #f0d7e6;border-radius:24px;padding:56px 70px;
    box-shadow:0 16px 40px rgba(67,56,202,.10)}
  .pinkc{background:var(--bg);border:1px dashed #f3c9dd;border-radius:24px;padding:56px 70px}
  svg{display:block}
</style>
</head>
<body>

  <span class="cap">White par</span>
  <div class="white">
    <div class="logo">
      <span class="word" style="font-size:70px">Arpita's
        <svg class="brush" viewBox="0 0 190 16" preserveAspectRatio="none"><defs><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><path d="M4 11 C 40 3, 150 3, 186 11" fill="none" stroke="url(#sw)" stroke-width="5" stroke-linecap="round"/></svg>
      </span>
      <span class="sub" style="font-size:14px;margin-top:20px">AFTER&nbsp;SCHOOL&nbsp;CLASSES</span>
    </div>
  </div>

  <span class="cap">Pink background par (site jaisa)</span>
  <div class="pinkc">
    <div class="logo">
      <span class="word" style="font-size:70px">Arpita's
        <svg class="brush" viewBox="0 0 190 16" preserveAspectRatio="none"><path d="M4 11 C 40 3, 150 3, 186 11" fill="none" stroke="url(#sw)" stroke-width="5" stroke-linecap="round"/></svg>
      </span>
      <span class="sub" style="font-size:14px;margin-top:20px">AFTER&nbsp;SCHOOL&nbsp;CLASSES</span>
    </div>
  </div>

</body>
</html>
