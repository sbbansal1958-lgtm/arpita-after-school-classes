<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option 4 — Yellow text on Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef2ff;color:#1f2440;font-family:"Poppins",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:56px 20px}
  .cap{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#64748b;font-weight:700}
  .logo{display:flex;flex-direction:column;align-items:center;text-align:center}
  .word{position:relative;display:inline-block;font-weight:700;line-height:1;letter-spacing:.4px;color:#fde047}
  .word .brush{position:absolute;left:-1%;bottom:.02em;width:102%;height:.30em}
  .sub{font-weight:700;letter-spacing:5px;color:#fde68a}
  .panel{border-radius:26px;padding:58px 76px;box-shadow:0 18px 44px rgba(30,58,138,.28)}
  .pA{background:#1e3a8a}
  .pB{background:#2563eb}
  .pC{background:linear-gradient(140deg,#3b82f6,#1e3a8a)}
  svg{display:block}
</style>
</head>
<body>

  <span class="cap">A · Royal blue</span>
  <div class="panel pA">
    <div class="logo">
      <span class="word" style="font-size:70px">Arpita's
        <svg class="brush" viewBox="0 0 190 16" preserveAspectRatio="none"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><path d="M4 11 C 40 3, 150 3, 186 11" fill="none" stroke="url(#g1)" stroke-width="5" stroke-linecap="round"/></svg>
      </span>
      <span class="sub" style="font-size:14px;margin-top:20px">AFTER&nbsp;SCHOOL&nbsp;CLASSES</span>
    </div>
  </div>

  <span class="cap">B · Bright blue</span>
  <div class="panel pB">
    <div class="logo">
      <span class="word" style="font-size:70px">Arpita's
        <svg class="brush" viewBox="0 0 190 16" preserveAspectRatio="none"><path d="M4 11 C 40 3, 150 3, 186 11" fill="none" stroke="url(#g1)" stroke-width="5" stroke-linecap="round"/></svg>
      </span>
      <span class="sub" style="font-size:14px;margin-top:20px">AFTER&nbsp;SCHOOL&nbsp;CLASSES</span>
    </div>
  </div>

  <span class="cap">C · Blue gradient</span>
  <div class="panel pC">
    <div class="logo">
      <span class="word" style="font-size:70px">Arpita's
        <svg class="brush" viewBox="0 0 190 16" preserveAspectRatio="none"><path d="M4 11 C 40 3, 150 3, 186 11" fill="none" stroke="url(#g1)" stroke-width="5" stroke-linecap="round"/></svg>
      </span>
      <span class="sub" style="font-size:14px;margin-top:20px">AFTER&nbsp;SCHOOL&nbsp;CLASSES</span>
    </div>
  </div>

</body>
</html>
